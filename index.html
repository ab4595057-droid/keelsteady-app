<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keel Steady</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--line:#2b2415;--tx:#f3eee3;--mut:#a39d8c;--gold:#e2b857;--gd:#c8962f;--up:#46c58a;--dn:#ef5b5b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:10px 14px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:linear-gradient(180deg,#15130e,#0c0b08);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(226,184,87,.08)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.hero{text-align:center;margin-bottom:10px}
.hero img{width:min(62%,240px);display:block;margin:0 auto;mix-blend-mode:screen}
.hero .pill{display:inline-block;margin-top:-4px}
.pill{font-size:12px;padding:7px 12px;border-radius:99px;background:#14110a;color:var(--gold);border:1px solid #3a2f14;letter-spacing:.2px}
.lbl{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:6px}
.num{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}.kv b{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
h2{font:600 19px/1.25 Georgia,"Times New Roman",serif;letter-spacing:.3px;margin-bottom:4px;background:linear-gradient(180deg,#f7dc8b,#d4a84a 60%,#a97a26);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
h3{font:600 17px Georgia,"Times New Roman",serif;color:#e9e4d6}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button,.chips button{background:#14110a;color:var(--mut);border:1px solid var(--line);border-radius:12px;font:inherit}
.tabs button{padding:8px 14px;font-size:13px}
.tabs button.on,.chips button.on{background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305;border-color:#c8962f;font-weight:700}
svg{width:100%;height:auto;display:block}
.muted{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .h{color:var(--mut);font-size:12px;padding:6px 0}
.cal div{min-height:48px;font-size:12px;color:#b9b3a2;padding-top:5px;border-radius:10px}
.cal small{display:block;font-size:10px;font-weight:600;margin-top:2px}
.cal .t{outline:1.5px solid var(--gold)}
.nav{display:flex;justify-content:space-between;align-items:center}
.nav button{background:none;border:0;color:var(--gold);font-size:22px;padding:2px 10px}
.coin{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px}
.badge.up{background:#10291d}.badge.dn{background:#34181a}.badge.wt{background:#2a2410;color:#f3d27a}
.dz{margin-top:8px}.dz .bk{margin-top:0}.pgb{height:4px;border-radius:2px;background:#1c1a14;margin-top:5px;overflow:hidden}.pgb i{display:block;height:100%;background:#6b5a2a}.pgb i.hit{background:var(--gold)}
.bk{display:flex;justify-content:space-between;gap:14px;margin-top:8px;font-size:14px}.bk .lbl{flex:none}.bk b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.bt{margin:6px 0 2px}.bt .tag{margin:0 6px 0 0}
.tr{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tr:first-of-type{border-top:0}
.me{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7a5818,#e2b857);color:#1a1305;display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#050504;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#7d7766;font:inherit;font-size:11px;display:grid;gap:3px;justify-items:center;padding:4px 10px;border-radius:14px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
.note{font-size:12px;color:var(--mut);text-align:center;margin:14px 8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;background:#2a2518;border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--gd)}.tg.on::after{left:25px}
.chips{display:flex;gap:8px;margin:10px 0}
.chips button{flex:1;padding:12px 0;color:var(--tx);font-weight:600}
.warn{background:#2b1f12;border:1px solid #4a3418;color:#f3c98b;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.mode{display:block;width:100%;text-align:left;background:#11100b;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;color:var(--tx);font:inherit}
.mode b{display:block;font-size:15px}.mode span{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.mode.on{border-color:var(--gold);background:#1b1608}.mode:disabled{opacity:.5}
.mode .pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pl i{font-style:normal;font-size:12px;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.hint{font-size:13px;color:var(--mut);margin:10px 0 2px}
.sum{background:#1a1508;border:1px solid #3a2f14;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.inp{width:100%;padding:13px 12px;border-radius:12px;background:#080706;border:1px solid var(--line);color:var(--tx);font:inherit;margin-top:8px}
.inp:focus{outline:1px solid var(--gold)}
.steps{margin:8px 0 0 18px;color:var(--mut);font-size:13px}.steps li{margin-top:5px}
.seg{display:flex;gap:6px;background:#0c0b08;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:10px 0;border:0;border-radius:10px;background:none;color:var(--mut);font:inherit;font-weight:600}
.seg button.on{background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305}
.stp{display:flex;gap:8px;align-items:center;margin-top:6px}
.stp button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#14110a;color:var(--gold);font-size:22px;flex:none}
.stp .inp{margin:0;text-align:center;font-size:18px;font-weight:700}
.chips.wrap{flex-wrap:wrap}.chips.wrap button{flex:1 0 17%;padding:11px 0}
.chips button:disabled{opacity:.45}
.chips.c3 button{flex:1 0 28%}
.wz{display:flex;justify-content:space-between;margin:2px 0 14px}
.wz button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:10px;display:grid;justify-items:center;gap:4px;padding:0}
.wz i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;background:#0c0b08}
.wz .ok i{border-color:#c8962f;color:var(--gold)}
.wz .on{color:var(--gold)}.wz .on i{background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305;border-color:#c8962f;font-weight:700}
.wzn{display:flex;gap:10px;margin-top:4px}.wzn button{flex:1}
.pit+.pit{border-top:1px solid var(--line)}
.pos{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.pos .pi{flex:1;min-width:0;overflow-wrap:anywhere}.pos .pp{display:grid;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pos .pp small{font-size:12px}
.mini{flex:none;padding:8px 12px;border-radius:10px;border:1px solid #4a1d20;background:#2a1214;color:#f0706f;font:inherit;font-size:13px;font-weight:600}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px;vertical-align:middle;white-space:nowrap}.coin>.tag{flex:none}
.ghost.sm{margin-top:8px;padding:10px;font-size:14px}
.acc{border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}.acc b{display:block;margin-bottom:2px}
.acc.real{background:#2a2410;border:1px solid #c8962f;color:#f3d27a}.acc.demo{background:#14110a;border:1px solid var(--line);color:var(--mut)}
.tag.real{border-color:#c8962f;color:#f3d27a;background:#2a2410}.tag.demo{color:var(--mut)}
.ghost{width:100%;padding:14px;border-radius:14px;background:#14110a;color:var(--tx);border:1px solid var(--line);font:inherit;font-weight:600}
.ghost:disabled,.go:disabled{opacity:.45}
.tg.dis{opacity:.4}
.pf{display:flex;align-items:center;gap:16px;margin:6px 0 20px}
.pf .av{width:68px;height:68px;border:2px solid #3a2f14;font-size:26px;flex:none}
.pf>div:nth-child(2){flex:1;min-width:0}
.pf b{font-size:22px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.pf .muted{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .gl{flex:none}
.lab{color:var(--mut);font-size:15px;margin:18px 2px 10px}
.bc{display:flex;align-items:center;gap:14px}
.bc .amt{flex:1;font-size:28px;font-weight:700;color:var(--up);font-variant-numeric:tabular-nums}
.eye{background:none;border:0;color:var(--gold);padding:6px}
.eye svg,.ib svg,.rw>svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:#15130e;color:#a39d8c}
.ib.g{background:#10291d;color:var(--up)}.ib.r{background:#2a1214;color:#f0706f}.ib.y{background:#1f1a0c;color:var(--gold)}
.rw{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,#15130e,#0c0b08);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;color:var(--tx);font:inherit}
.rt{flex:1;display:grid;gap:2px;min-width:0}.rt b{font-size:16px}.rt span{color:var(--mut);font-size:13px}
.rw>svg{color:var(--mut);flex:none;width:20px}.rw .act{color:var(--gold);font-weight:600;font-size:14px;flex:none}
.ib.xl{width:62px;font-size:10px;font-weight:800;letter-spacing:.2px;color:var(--tx);background:#0a0907;border:1px solid var(--line)}
.rw:disabled{opacity:.5}
.back{background:none;border:0;color:var(--gold);font:inherit;font-size:15px;padding:4px 0}
.navav{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);display:block;background:linear-gradient(135deg,#7a5818,#e2b857)}
nav button.on .navav{border-color:var(--gold)}
.li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}.li:first-of-type{border-top:0}
.li i{font-style:normal;width:22px;flex:none;color:var(--gold)}
.slide h2{margin-bottom:6px}.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:99px;background:#3a2f14}.dots i.on{background:var(--gold);width:22px}.li.todo i{color:var(--mut)}
.plan{text-align:center;padding:20px 0 14px}
.plan .d{font:600 20px Georgia,"Times New Roman",serif;color:var(--mut)}
.plan .p{font-size:44px;font-weight:700;margin:6px 0;background:linear-gradient(180deg,#f7dc8b,#d4a84a 60%,#a97a26);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.addr{word-break:break-all;background:#0a0907;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin-top:8px;user-select:all}
.gl{margin-left:auto;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#14110a;color:var(--gold);display:grid;place-items:center;flex:none}
.gl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.go{width:100%;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305;font:inherit;font-weight:700;margin-top:4px}
.go.red{background:#2a1214;color:#f0706f;border:1px solid #4a1d20}
</style>
</head>

let tkKey = "", tkRx = null;

function tickRx() {
  const set = new Set(["BTC", "ETH", "SOL", "BNB", "XRP", "DOGE"]);

    [D.p, D.ps, (D.rl || {}).pos, (D.fv || {}).pos, (D.rf || {}).pos].forEach(a => (a || []).forEach(r => set.add(r[0])));

    ((D.fv || {}).coins || []).concat((D.rf || {}).coins || []).forEach(n => set.add(n));

  if (names !== tkKey || !tkRx) { tkKey = names; tkRx = new RegExp("\\b(?:" + names + ")\\b|[A-Za-z0-9]{4}…[A-Za-z0-9]{2,3}|[+−-]?\\$?\\d[\\d,]*(?:\\.\\d+)?%?", "g"); }
  return tkRx;
}

function trText(s) {

function staleBar() {

  const t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]), mins = Math.round((Date.now() - t) / 6e4);
  if (!(mins > 10)) return "";
  const d = new Date(t), hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const ago = mins < 90 ? `${mins} мин назад` : mins < 2880 ? `${Math.round(mins / 60)} ч назад` : `${Math.round(mins / 1440)} дн. назад`;
  return `<div class="warn stale" style="margin:0 0 10px"><b>Данные устарели</b><div>Обновлено ${hm}, ${ago}.</div><div class="muted" style="margin-top:4px">Нажмите «Обновить»: приложение закроется, а в чате появится свежая кнопка «Открыть Keel Steady». Откройте её снова.</div><button class="go" data-refresh="1" style="margin-top:8px">Обновить</button></div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; cf = ""; qc = ""; if (tab === "me") pv = "main"; if (tab === "ex") xv = ""; window.scrollTo(0, 0); }
  else if (b.dataset.cl) cf = b.dataset.cl;
  else if (b.dataset.cln) cf = "";
  else if (b.dataset.bedit) {   // «Изменить» у бота: открываем его настройки во вкладке «Торговля»
    const x = {s: ["demo", "spot", "s"], f: ["demo", "fut", "f"], r: ["real", "spot", "r"], rf: ["real", "fut", "f"]}[b.dataset.bedit];
    if (!x) return;
    acct = x[0]; ts = x[1]; W[x[2]] = 0; tab = "ctl"; dr = false; cf = ""; window.scrollTo(0, 0);
  }
  else if (b.dataset.qs || b.dataset.qx || b.dataset.qxc) {   // «Включить» / «Остановить» в карточке бота: действует сохранённая настройка, не черновик
    const go = m => { if (T() && T().sendData) T().sendData(JSON.stringify(m)); else say("Откройте приложение из Telegram, кнопкой в чате с ботом."); };
    if (b.dataset.qs) { go({s: {on: true}, f: {a: "fut", m: "dry"}, r: {a: "real", m: "live", per: JSON.parse(rgbase || "{}").dep || 0}, rf: {a: "rfstart"}}[b.dataset.qs]); return; }
    if (b.dataset.qxc) { go(b.dataset.qxc === "r" ? {a: "realstop"} : {a: "rfstop"}); return; }
    if (b.dataset.qx === "s") { go({on: false}); return; }
    if (b.dataset.qx === "f") { go({a: "fut", m: "off"}); return; }
    qc = b.dataset.qx;   // реальные боты: сначала подтверждение в карточке
  }
  else if (b.dataset.qxn) qc = "";
  else if (b.dataset.cly) {
    const [k, nm] = b.dataset.cly.split(":");
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "close", k, s: nm})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.xv !== undefined) { tab = "ex"; xv = b.dataset.xv; window.scrollTo(0, 0); }
  else if (b.dataset.ch) { if (T() && T().openTelegramLink) T().openTelegramLink(CHANNEL); else window.open(CHANNEL, "_blank"); return; }
  else if (b.dataset.rep) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "report", on: !D.rep})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.trial) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "trial"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.refpay) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "refpay"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.pay) {
    if (AP()) { if (T() && T().sendData) T().sendData(JSON.stringify({a: "pay"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом."); return; }
    tab = "me"; pv = "sub"; window.scrollTo(0, 0);
  }
  else if (b.dataset.r) range = b.dataset.r;
  else if (b.dataset.m) { cm[1] += +b.dataset.m; if (cm[1] < 0) { cm[1] = 11; cm[0]--; } if (cm[1] > 11) { cm[1] = 0; cm[0]++; } }
  else if (b.dataset.on) ctl.on = !ctl.on;
  else if (b.dataset.ts) ts = b.dataset.ts;
  else if (b.dataset.ac) { acct = b.dataset.ac; dr = false; cf = ""; }
  else if (b.dataset.lang) { lang = lang === "en" ? "ru" : "en"; try { localStorage.setItem("ks_lang", lang); } catch (e) {} staticLang(); }
  else if (b.dataset.deck !== undefined) { pres.d = +b.dataset.deck; pres.s = 0; window.scrollTo(0, 0); }
  else if (b.dataset.slide) presStep(+b.dataset.slide);
  else if (b.dataset.pgo) {
    const g = b.dataset.pgo; window.scrollTo(0, 0);
    if (g === "ex") { tab = "ex"; xv = "bybit"; } else if (g === "sub") { tab = "me"; pv = "sub"; } else { tab = g; cf = ""; }
  }
  else if (b.dataset.pv) { pv = b.dataset.pv; wp = false; if (pv === "pres") pres.d = -1; window.scrollTo(0, 0); }
  else if (b.dataset.eye) { hide = !hide; try { localStorage.setItem("ks_hide", hide ? "1" : "0"); } catch (e) {} }
  else if (b.dataset.copy) {
    const ok = copyText(b.dataset.copy === "ref" ? refData().l : PAY.addr), old = b.dataset.t0 || b.textContent;
    b.dataset.t0 = old; b.textContent = trText(ok ? "Скопировано ✓" : "Не удалось скопировать");
    clearTimeout(b.__t); b.__t = setTimeout(() => { b.textContent = trText(old); }, 1600); return;
  }
  else if (b.dataset.share) {
    const l = refData().l; if (!l) return;
    const url = "https://t.me/share/url?url=" + encodeURIComponent(l) + "&text=" + encodeURIComponent(lang === "en" ? "Keel Steady: a futures trading bot for Bybit and BingX." : "Keel Steady: торговый бот для фьючерсов на Bybit и BingX.");
    if (T() && T().openTelegramLink) T().openTelegramLink(url); else window.open(url, "_blank"); return;
  }
  else if (b.dataset.sup) { const url = "https://t.me/" + SUPPORT + (b.dataset.sup.length > 1 ? "?text=" + b.dataset.sup : ""); if (T() && T().openTelegramLink) T().openTelegramLink(url); else window.open(url, "_blank"); return; }
  else if (b.dataset.pres) { const x = PRES[+b.dataset.pres]; if (x) { if (T() && T().openLink) T().openLink(x.u); else window.open(x.u, "_blank"); } return; }
  else if (b.dataset.wp) {
    if (b.dataset.wp === "ask") wp = true; else if (b.dataset.wp === "no") wp = false;
    else { if (T() && T().sendData) T().sendData(JSON.stringify({a: "wipe"})); return; }
  }
  else if (b.dataset.demo) {
    if (b.dataset.demo === "ask") dr = true;
    else if (b.dataset.demo === "no") dr = false;
    else { if (T() && T().sendData) T().sendData(JSON.stringify({a: "demo_reset"})); return; }
  }
  else if (b.dataset.set) { const [sc, k, v] = b.dataset.set.split(":"); cfgOf(sc)[k] = isNaN(+v) ? v : +v; }
  else if (b.dataset.pre) {
    const [sc, id] = b.dataset.pre.split(":"), p = [...PRESETS, GRID].find(x => x.id === id), o = cfgOf(sc), dm = sc === "f" && !isRF("f");
    if (p && o && (!p.lev || dm)) {
      if (sc !== "f") o.md = "dip";
      if (p.lev) o.lev = p.lev;
      const v = preVals(p, sc === "f" ? o.lev : 1);
      setVals(o, v); Object.assign(o, {n: p.n, ov: p.ov, ind: p.ind, mart: p.mart, tf: p.tf});
      if (dm) Object.assign(o, {dsl: v.dsl, cd: v.cd});   // обычный набор сбрасывает аварийный стоп и паузу к обычным значениям
      if (p.lev && o.dep < 35 * o.coins.length) o.dep = 35 * o.coins.length;   // при 20 ордерах первый ордер должен быть не меньше 1 USDT
      fix(o);
    }
  }
  else if (b.dataset.tu) {
    const [sc, i] = b.dataset.tu.split(":"), r = ((D.tn || {}).r || [])[+i], o = cfgOf(sc);
    if (r && o) { if (sc !== "f") o.md = "dip"; setVals(o, {buy: r[0], tp: r[1], sl: r[2], tb: r[3]}); }
  }
  else if (b.dataset.tune) {
    const sc = b.dataset.tune, msg = sc === "f" ? futMsg() : spotMsg(sc);
    if (T() && T().sendData) T().sendData(JSON.stringify({...msg, a: "tune", k: slotKey(sc)})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.st) { const [sc, k, v, rk] = b.dataset.st.split(":"), o = cfgOf(sc); o[k] = clampK(k, o[k] + +v, rk); fix(o); }
  else if (b.dataset.co) {
    const [sc, n] = b.dataset.co.split(":"), o = cfgOf(sc), key = sc === "f" ? "coins" : "cs", i = o[key].indexOf(n);
    if (i >= 0) { if (o[key].length > 1) o[key].splice(i, 1); } else if (o[key].length < MAXP && NAME_RE.test(n)) { o[key].push(n); pq[sc] = ""; }
  }
  else if (b.dataset.wz) { const [sc, i] = b.dataset.wz.split(":"); W[sc] = Math.min(7, Math.max(0, +i)); window.scrollTo(0, 0); }
  else if (b.dataset.tg) {
    const [sc, k] = b.dataset.tg.split(":"), o = cfgOf(sc);
    if (k === "slon") { o.sl = o.sl > 0 ? 0 : 10; if (!o.sl && !o.dsl) o.ssl = false; }
    else if (k === "dsl") { o.dsl = o.dsl > 0 ? 0 : 30; if (!o.sl && !o.dsl) o.ssl = false; }
    else if (k === "m") o.m = o.m === "dry" ? "off" : "dry";
    else if (k === "tb") o.tb = o.tb > 0 ? 0 : 0.5;
    else o[k] = !o[k];
  }
  else if (b.dataset.bt) {
    if (T() && T().sendData) T().sendData(JSON.stringify(b.dataset.bt === "f" ? {...futMsg(), a: "backtest", mk: "fut"} : {...spotMsg(b.dataset.bt), a: "backtest"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.sv) {
    const msg = b.dataset.sv === "f" ? futMsg() : spotMsg(b.dataset.sv);
    if (T() && T().sendData) T().sendData(JSON.stringify(msg)); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.lv) ctl.lv = +b.dataset.lv;
  else if (b.dataset.md) ctl.md = b.dataset.md;
  else if (b.dataset.buy) ctl.buy = +b.dataset.buy;
  else if (b.dataset.tp) ctl.tp = +b.dataset.tp;
  else if (b.dataset.sl !== undefined) ctl.sl = +b.dataset.sl;
  else if (b.dataset.rm) rc.m = b.dataset.rm;
  else if (b.dataset.rp) rc.per = +b.dataset.rp;
  else if (b.dataset.rsave) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "real", m: rc.m, per: rc.per}));
    else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.rstart) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "real", m: "live", per: rg.dep})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.rstop) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "realstop"}));
    return;
  }
  else if (b.dataset.rfstart) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "rfstart"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.rfstop) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "rfstop"})); else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.cx) {
    const k = document.getElementById("ak").value.trim(), sc = document.getElementById("as").value.trim();
    if (!/^[A-Za-z0-9]{8,64}$/.test(k) || !/^[A-Za-z0-9]{16,128}$/.test(sc)) { say("Проверьте ключи: они состоят из букв и цифр, без пробелов."); return; }
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "connect", n: XD[xv] ? xv : "bybit", k, s: sc}));
    else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.refresh) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "refresh"}));
    else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.dx) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "disconnect"}));
    return;
  }
  else if (b.dataset.save) {
    if (T() && T().sendData) T().sendData(JSON.stringify({on: ctl.on, lev: ctl.lv, mode: ctl.md, buy: ctl.buy, tp: ctl.tp, sl: ctl.sl}));
    else say("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else return;
  render();
});

// Свайп по слайду: влево — дальше, вправо — назад
(() => {
  let x0 = null, y0 = 0;
  document.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive: true});
  document.addEventListener("touchend", e => {
    if (x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (tab !== "me" || pv !== "pres" || !DECKS[pres.d] || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    presStep(dx < 0 ? 1 : -1); render();
  }, {passive: true});
})();

const guessLang = () => { const c = (tgUser().language_code || "").slice(0, 2); return c === "" || ["ru", "uk", "be", "kk"].includes(c) ? "ru" : "en"; };
(async () => {
  if (!lang) lang = guessLang();
  staticLang();
  const q = new URLSearchParams(location.search).get("d");
  if (!q) { setApp('<div class="card"><h2>Откройте приложение из бота</h2><p class="muted">Нажмите «📱 Приложение» в чате с ботом Keel Steady.</p></div>'); return; }
  try { D = await decode(q); } catch (e) { setApp('<div class="card"><h2>Не удалось прочитать данные</h2><p class="muted">Обновите Telegram и снова нажмите «📱 Приложение» в боте.</p></div>'); return; }
  const l = new Date().toISOString().slice(0, 10).split("-"); cm = [+l[0], +l[1] - 1];
  if (!lang) lang = D.lg || guessLang();
  staticLang();
  acct = "real"; ctl = fresh(mk(D), "s", !!D.on && D.md === "dip"); base = JSON.stringify(ctl); fc = fresh(mkF(D), "f", !!(D.fv && D.fv.m === "dry"), true); fbase = JSON.stringify(fc);
  if (acct === "real" && D.rf && D.rf.m === "live" && !(D.rl && D.rl.m !== "off")) ts = "fut";   // работают только реальные фьючерсы: показываем их, а не выключенный спот
  rc = {m: (D.rl || {}).m === "live" ? "live" : "off", per: (D.rl || {}).per || 10}; rbase = JSON.stringify(rc);
  if (D.rf) { rfc = fresh(mkF({fv: D.rf}), "rf", D.rf.m === "live", true); if (!rfc.sl) rfc.sl = 10; rfbase = JSON.stringify(rfc); }
  if (D.rg) { const g = D.rg; rg = fresh(mk({nm: g.nm, dep: g.dep, tf: g.tf, sa: g.sa, ssl: g.ssl, dc: g.dc, p: (g.cs || []).map(n => [n]), on: 0, lv: 1, md: g.md, dp: g.dp, re: g.re, rj: g.rj}), "r", !!(D.rl && D.rl.m !== "off" && g.md === "dip")); rgbase = JSON.stringify(rg); }
  render(); setNavAvatar();
  try {   // полный список пар Bybit (файл создаёт бот); нет файла, остаётся встроенный краткий список
    fetch("pairs.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : Promise.reject()).then(j => {
      const ok = a => Array.isArray(a) && a.length > 5 && a.every(x => typeof x === "string" && NAME_RE.test(x));
      if (!j || !ok(j.s) || !ok(j.f)) return;
      PAIRS = {s: j.s, f: j.f};
      const ae = document.activeElement; if (!(ae && ae.dataset && ae.dataset.pq)) render();
    }).catch(() => {});
  } catch (e) {}
})();
</script>
