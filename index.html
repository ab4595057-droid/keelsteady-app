<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keel Steady</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0e14;--card:#121722;--line:#1f2735;--tx:#e8ecf3;--mut:#8b95a7;--up:#22c58b;--dn:#f0576a;--ac:#3b82f6;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1d2a44,#3b82f6);display:grid;place-items:center;font-style:normal;font-size:18px}
.pill{font-size:12px;padding:7px 12px;border-radius:99px;background:#1a2336;color:#9db7ee;border:1px solid #27344f}
.lbl{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:6px}
.num{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}.kv b{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
h2{font-size:18px;margin-bottom:4px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{background:#161d2b;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:inherit;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
svg{width:100%;height:auto;display:block}
.muted{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .h{color:var(--mut);font-size:12px;padding:6px 0}
.cal div{min-height:48px;font-size:12px;color:#aab3c2;padding-top:5px;border-radius:10px}
.cal small{display:block;font-size:10px;font-weight:600;margin-top:2px}
.cal .t{outline:1.5px solid var(--ac)}
.nav{display:flex;justify-content:space-between;align-items:center}
.nav button{background:none;border:0;color:var(--tx);font-size:22px;padding:2px 10px}
.coin{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coin h3{font-size:17px}.badge{font-size:12px;padding:3px 9px;border-radius:99px}
.badge.up{background:#12332a}.badge.dn{background:#3a1b22}
.tr{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tr:first-of-type{border-top:0}
.me{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#27344f,#3b82f6);display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0e121a;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;display:grid;gap:3px;justify-items:center;padding:4px 18px;border-radius:14px}
nav button span{font-size:20px}nav button.on{color:#6ea3ff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;background:#27304a;border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--up)}.tg.on::after{left:25px}
.chips{display:flex;gap:8px;margin:10px 0}
.chips button{flex:1;padding:12px 0;border-radius:12px;background:#161d2b;color:var(--tx);border:1px solid var(--line);font:inherit;font-weight:600}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{width:100%;padding:14px;border-radius:14px;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;margin-top:4px}
.warn{background:#2b1f12;border:1px solid #4a3418;color:#f3c98b;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.note{font-size:12px;color:var(--mut);text-align:center;margin:14px 8px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
 <button data-tab="home"><span>🏠</span>Главная</button>
 <button data-tab="port"><span>💼</span>Портфель</button>
 <button data-tab="ctl"><span>⚡</span>Торговля</button>
 <button data-tab="me"><span>👤</span>Профиль</button>
</nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0b0e14"); tg.setBackgroundColor("#0b0e14"); } catch (e) {} }
const $ = s => document.querySelector(s), app = $("#app");
let D = null, tab = "home", range = "7", cm = null, ctl = null;

const money = (n, sg) => (n < 0 ? "−" : sg ? "+" : "") + "$" + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const short = n => { const a = Math.abs(n); return (n < 0 ? "−" : "+") + "$" + (a >= 1000 ? (a / 1000).toFixed(1) + "K" : a.toFixed(a < 10 ? 2 : 0)); };
const cls = n => n > 0 ? "up" : n < 0 ? "dn" : "";
const px = p => p >= 100 ? p.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : p >= 1 ? p.toFixed(3) : p.toFixed(5);
const dshort = d => new Date(d + "T00:00:00Z").toLocaleDateString("ru-RU", {day: "numeric", month: "short", timeZone: "UTC"});

async function decode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const u = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  if (typeof DecompressionStream !== "undefined") {
    const st = new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate"));
    return JSON.parse(await new Response(st).text());
  }
  await new Promise((ok, no) => { const x = document.createElement("script"); x.src = "https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"; x.onload = ok; x.onerror = no; document.head.appendChild(x); });
  return JSON.parse(pako.inflate(u, {to: "string"}));
}

function chart(pts) {
  if (pts.length < 2) return '<p class="muted">Пока мало данных. График появится, когда бот запишет несколько дней.</p>';
  const W = 320, H = 180, L = 50, B = 24, T = 8, R = 8, vs = pts.map(p => p[1]);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo || 1) * .12; lo -= pad; hi += pad;
  const t0 = Date.parse(pts[0][0]), t1 = Date.parse(pts[pts.length - 1][0]) || t0 + 1;
  const X = d => L + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const col = vs[vs.length - 1] >= vs[0] ? "#22c58b" : "#f0576a";
  let g = "";
  for (let i = 0; i < 4; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#1f2735"/><text x="${L - 6}" y="${y + 4}" fill="#8b95a7" font-size="10" text-anchor="end">${money(v).replace(/\.\d\d$/, "")}</text>`; }
  const xs = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map(i => `<text x="${Math.min(Math.max(X(pts[i][0]), L + 14), W - 16)}" y="${H - 6}" fill="#8b95a7" font-size="10" text-anchor="middle">${dshort(pts[i][0])}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${line} L${X(pts[pts.length - 1][0])} ${H - B} L${X(pts[0][0])} ${H - B}Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>${xs}</svg>`;
}

function daily() {
  const m = {}; for (let i = 1; i < D.e.length; i++) m[D.e[i][0]] = (m[D.e[i][0]] || 0) + D.e[i][1] - D.e[i - 1][1]; return m;
}

function home() {
  const e = D.e, n = e.length, d24 = n > 1 ? e[n - 1][1] - e[n - 2][1] : 0, tot = D.t - D.s;
  const open = D.p.filter(c => c[1] > 0).length;
  const days = {"7": 7, "30": 30, "90": 90, "all": 99999}[range], last = Date.parse(e[n - 1][0]);
  let pts = e.filter(p => last - Date.parse(p[0]) <= days * 864e5); if (pts.length < 2) pts = e.slice(-2);
  pts = pts.map(p => [p[0], p[1] - D.s]);
  const dm = daily(), [y, mo] = cm, first = (new Date(Date.UTC(y, mo, 1)).getUTCDay() + 6) % 7, dim = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  const today = new Date().toISOString().slice(0, 10); let mt = 0, cells = "";
  for (let i = 0; i < first; i++) cells += "<div></div>";
  for (let d = 1; d <= dim; d++) { const k = `${y}-${String(mo + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`, v = dm[k]; if (v) mt += v;
    cells += `<div class="${k === today ? "t" : ""}">${d}${v !== undefined ? `<small class="${cls(v)}">${short(v)}</small>` : ""}</div>`; }
  const mn = new Date(Date.UTC(y, mo, 1)).toLocaleDateString("ru-RU", {month: "long", year: "numeric", timeZone: "UTC"});
  return `<div class="top"><div class="logo"><i>⚓</i>Keel Steady</div><span class="pill">${D.on ? "Торговля вкл · x" + (D.lv || 1) : "Торговля выкл"}</span></div>
  <div class="row"><div class="card"><div class="lbl">Ваши активы</div><div class="big">${money(D.t)}</div></div>
  <div class="card"><div class="lbl">Баланс</div><div class="kv"><span class="lbl">Старт</span><b>${money(D.s)}</b></div><div class="kv"><span class="lbl">Свободно</span><b>${money(D.c)}</b></div></div></div>
  <div class="row"><div class="card"><div class="lbl">Доход за 24ч</div><div class="num ${cls(d24)}">${money(d24, 1)}</div></div>
  <div class="card"><div class="lbl">Доход всего</div><div class="num ${cls(tot)}">${money(tot, 1)}</div></div></div>
  <div class="row"><div class="card"><div class="lbl">Закрыто сделок</div><div class="num">${D.ct}</div></div>
  <div class="card"><div class="lbl">Монет в позиции</div><div class="num">${open} из ${D.p.length}</div></div></div>
  <div class="card"><h2>График прибыли</h2><div class="num ${cls(tot)}">${money(tot, 1)}</div>
  <div class="tabs">${[["7", "7D"], ["30", "30D"], ["90", "90D"], ["all", "Всё время"]].map(r => `<button data-r="${r[0]}" class="${range === r[0] ? "on" : ""}">${r[1]}</button>`).join("")}</div>${chart(pts)}</div>
  <div class="card"><h2>Торговый календарь</h2><div class="nav"><button data-m="-1">‹</button><span>${mn}</span><button data-m="1">›</button></div>
  <div class="lbl" style="text-align:center">За месяц: <b class="${cls(mt)}">${money(mt, 1)}</b></div>
  <div class="cal">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(x => `<div class="h">${x}</div>`).join("")}${cells}</div></div>`;
}

function port() {
  const coins = D.p.map(c => { const [nm, q, p, sma, up] = c, diff = (p / sma - 1) * 100;
    return `<div class="card"><div class="coin"><h3>${nm}</h3><span class="badge ${up ? "up" : "dn"}">${up ? "держим" : "вне рынка"}</span></div>
    <div class="kv"><span class="lbl">Цена</span><b>$${px(p)}</b></div><div class="kv"><span class="lbl">SMA200</span><b>$${px(sma)}</b></div>
    <div class="kv"><span class="lbl">От SMA200</span><b class="${cls(diff)}">${diff >= 0 ? "+" : ""}${diff.toFixed(1)}%</b></div>
    <div class="kv"><span class="lbl">В позиции</span><b>${q > 0 ? q + " ≈ " + money(c[5]) + (c[6] > 1 ? " · x" + c[6] : "") : "нет"}</b></div></div>`; }).join("");
  const trs = D.tr.slice().reverse().map(t => `<div class="tr"><span>${dshort(t[0])} · ${["продажа", "покупка", "ликвидация"][t[2]]} ${t[1]}</span><span>$${px(t[3])}${t[5] != null ? ` <b class="${cls(t[5])}">${t[5] >= 0 ? "+" : "−"}${Math.abs(t[5])}%</b>` : ""}</span></div>`).join("");
  return `<div class="top"><h2>Портфель</h2><span class="pill">Виртуальные деньги</span></div>${coins}
  <div class="card"><h2>История сделок</h2>${trs || '<p class="muted">Сделок пока нет.</p>'}${D.nt > D.tr.length ? `<p class="muted" style="margin-top:8px">Показаны последние ${D.tr.length} из ${D.nt}. Полная история есть в боте.</p>` : ""}</div>`;
}

function ctrl() {
  const ch = ctl.on !== !!D.on || ctl.lv !== (D.lv || 1), L = ctl.lv;
  return `<div class="top"><h2>Торговля</h2><span class="pill">Виртуальные деньги</span></div>
  <div class="card"><div class="sw"><div><b>Торговля ${ctl.on ? "включена" : "выключена"}</b><div class="muted">${ctl.on ? "Бот открывает и закрывает виртуальные позиции по сигналам." : "Все позиции будут закрыты, новые не открываются."}</div></div><button class="tg ${ctl.on ? "on" : ""}" data-on="1" aria-label="Включить или выключить торговлю"></button></div></div>
  <div class="card"><h2>Плечо</h2><div class="chips">${[1, 2, 3, 5].map(x => `<button data-lv="${x}" class="${L === x ? "on" : ""}">x${x}</button>`).join("")}</div>
  ${L > 1 ? `<div class="warn">Плечо увеличивает и прибыль, и убыток. При x${L} падение цены примерно на ${Math.round(100 / L)}% сжигает весь залог позиции (ликвидация). Сигнал проверяется раз в сутки, поэтому резкое падение может случиться раньше выхода.</div>` : '<p class="muted">x1: без плеча.</p>'}
  <p class="muted" style="margin-top:8px">Новое плечо действует на новые позиции. Открытые позиции остаются с прежним плечом.</p></div>
  ${ch ? '<button class="go" data-save="1">Сохранить в боте</button>' : ""}`;
}

function me() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user || {}, nm = [u.first_name, u.last_name].filter(Boolean).join(" ") || "Участник";
  return `<div class="top"><h2>Профиль</h2></div><div class="card me"><div class="av">${u.photo_url ? `<img src="${u.photo_url}" alt="">` : nm[0]}</div><div><b>${nm}</b><div class="muted">${u.username ? "@" + u.username : ""}</div></div></div>
  <div class="card"><h2>Мои монеты</h2><p class="muted">${D.p.map(c => c[0]).join(", ")}. Изменить выбор можно в боте, кнопка «⚙️ Профиль».</p></div>
  <div class="card"><h2>Как это работает</h2><p class="muted">Если дневная цена закрытия выше 200-дневной средней (SMA200), бот держит монету. Если ниже, выходит из неё. Все сделки виртуальные: настоящих денег и сделок на бирже нет.</p></div>
  <div class="card"><h2>Данные</h2><p class="muted">Обновлено: ${D.u}. Чтобы увидеть свежие данные, снова нажмите «📱 Приложение» в боте.</p></div>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!D) return;
  app.innerHTML = (tab === "home" ? home() : tab === "port" ? port() : tab === "ctl" ? ctrl() : me()) + '<p class="note">Это не финансовый совет. Результаты виртуальной торговли не гарантируют прибыль.</p>';
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; window.scrollTo(0, 0); }
  else if (b.dataset.r) range = b.dataset.r;
  else if (b.dataset.m) { cm[1] += +b.dataset.m; if (cm[1] < 0) { cm[1] = 11; cm[0]--; } if (cm[1] > 11) { cm[1] = 0; cm[0]++; } }
  else if (b.dataset.on) ctl.on = !ctl.on;
  else if (b.dataset.lv) ctl.lv = +b.dataset.lv;
  else if (b.dataset.save) {
    if (tg && tg.sendData) tg.sendData(JSON.stringify({on: ctl.on, lev: ctl.lv}));
    else alert("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else return;
  render();
});

(async () => {
  const q = new URLSearchParams(location.search).get("d");
  if (!q) { app.innerHTML = '<div class="card"><h2>Откройте приложение из бота</h2><p class="muted">Нажмите «📱 Приложение» в чате с ботом Keel Steady.</p></div>'; return; }
  try { D = await decode(q); } catch (e) { app.innerHTML = '<div class="card"><h2>Не удалось прочитать данные</h2><p class="muted">Обновите Telegram и снова нажмите «📱 Приложение» в боте.</p></div>'; return; }
  const l = D.e[D.e.length - 1][0].split("-"); cm = [+l[0], +l[1] - 1];
  ctl = {on: !!D.on, lv: D.lv || 1};
  render();
})();
</script>
</body>
</html>
