<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keel Steady</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--line:#2b2415;--tx:#f3eee3;--mut:#a39d8c;--gold:#e2b857;--gd:#c8962f;--up:#46c58a;--dn:#ef5b5b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:10px 14px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:linear-gradient(180deg,#15130e,#0c0b08);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(226,184,87,.08)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.hero{text-align:center;margin-bottom:10px}
.hero img{width:min(62%,240px);display:block;margin:0 auto;mix-blend-mode:screen}
.hero .pill{display:inline-block;margin-top:-4px}
.pill{font-size:12px;padding:7px 12px;border-radius:99px;background:#14110a;color:var(--gold);border:1px solid #3a2f14;letter-spacing:.2px}
.lbl{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:6px}
.num{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}.kv b{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
h2{font:600 19px/1.25 Georgia,"Times New Roman",serif;letter-spacing:.3px;margin-bottom:4px;background:linear-gradient(180deg,#f7dc8b,#d4a84a 60%,#a97a26);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
h3{font:600 17px Georgia,"Times New Roman",serif;color:#e9e4d6}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button,.chips button{background:#14110a;color:var(--mut);border:1px solid var(--line);border-radius:12px;font:inherit}
.tabs button{padding:8px 14px;font-size:13px}
.tabs button.on,.chips button.on{background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305;border-color:#c8962f;font-weight:700}
svg{width:100%;height:auto;display:block}
.muted{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .h{color:var(--mut);font-size:12px;padding:6px 0}
.cal div{min-height:48px;font-size:12px;color:#b9b3a2;padding-top:5px;border-radius:10px}
.cal small{display:block;font-size:10px;font-weight:600;margin-top:2px}
.cal .t{outline:1.5px solid var(--gold)}
.nav{display:flex;justify-content:space-between;align-items:center}
.nav button{background:none;border:0;color:var(--gold);font-size:22px;padding:2px 10px}
.coin{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px}
.badge.up{background:#10291d}.badge.dn{background:#34181a}
.tr{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tr:first-of-type{border-top:0}
.me{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7a5818,#e2b857);color:#1a1305;display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#050504;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#7d7766;font:inherit;font-size:11px;display:grid;gap:3px;justify-items:center;padding:4px 10px;border-radius:14px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
.note{font-size:12px;color:var(--mut);text-align:center;margin:14px 8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;background:#2a2518;border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--gd)}.tg.on::after{left:25px}
.chips{display:flex;gap:8px;margin:10px 0}
.chips button{flex:1;padding:12px 0;color:var(--tx);font-weight:600}
.warn{background:#2b1f12;border:1px solid #4a3418;color:#f3c98b;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.mode{display:block;width:100%;text-align:left;background:#11100b;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;color:var(--tx);font:inherit}
.mode b{display:block;font-size:15px}.mode span{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.mode.on{border-color:var(--gold);background:#1b1608}
.hint{font-size:13px;color:var(--mut);margin:10px 0 2px}
.sum{background:#1a1508;border:1px solid #3a2f14;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.inp{width:100%;padding:13px 12px;border-radius:12px;background:#080706;border:1px solid var(--line);color:var(--tx);font:inherit;margin-top:8px}
.inp:focus{outline:1px solid var(--gold)}
.steps{margin:8px 0 0 18px;color:var(--mut);font-size:13px}.steps li{margin-top:5px}
.go{width:100%;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#f3d27a,#c8962f 55%,#9a6f22);color:#1a1305;font:inherit;font-weight:700;margin-top:4px}
.go.red{background:#2a1214;color:#f0706f;border:1px solid #4a1d20}
</style>
</head>
<body>
<main id="app"><p class="note">Загружаю данные…</p></main>

 <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
 <button data-tab="port"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10V7a2 2 0 0 1 2-2h11"/><circle cx="16.5" cy="13.5" r="1.1"/></svg>Портфель</button>
 <button data-tab="ctl"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Торговля</button>

</nav>

async function decode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const u = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  if (typeof DecompressionStream !== "undefined") {
    const st = new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate"));
    return JSON.parse(await new Response(st).text());
  }
  await new Promise((ok, no) => { const x = document.createElement("script"); x.src = "https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"; x.onload = ok; x.onerror = no; document.head.appendChild(x); });
  return JSON.parse(pako.inflate(u, {to: "string"}));

function chart(pts) {
  if (pts.length < 2) return '<p class="muted">Пока мало данных. График появится, когда бот запишет несколько дней.</p>';
  const ax = v => Math.abs(v) < 0.005 ? "$0" : (Math.max(...pts.map(p => p[1])) - Math.min(...pts.map(p => p[1]))) < 10 ? money(v) : money(v).replace(/\.\d\d$/, "");
  const W = 320, H = 180, L = 50, B = 24, T = 8, R = 8, vs = pts.map(p => p[1]);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo || 1) * .12; lo -= pad; hi += pad;
  const t0 = Date.parse(pts[0][0]), t1 = Date.parse(pts[pts.length - 1][0]) || t0 + 1;
  const X = d => L + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const col = vs[vs.length - 1] >= vs[0] ? "#22c58b" : "#f0576a";
  let g = "";
  for (let i = 0; i < 4; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2b2415"/><text x="${L - 6}" y="${y + 4}" fill="#a39d8c" font-size="10" text-anchor="end">${ax(v)}</text>`; }
  const xs = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map(i => `<text x="${Math.min(Math.max(X(pts[i][0]), L + 14), W - 16)}" y="${H - 6}" fill="#a39d8c" font-size="10" text-anchor="middle">${dshort(pts[i][0])}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${line} L${X(pts[pts.length - 1][0])} ${H - B} L${X(pts[0][0])} ${H - B}Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>${xs}</svg>`;
}

function daily() {
  const m = {}; for (let i = 1; i < D.e.length; i++) m[D.e[i][0]] = (m[D.e[i][0]] || 0) + D.e[i][1] - D.e[i - 1][1]; return m;
}

function home() {
  const e = D.e, n = e.length, d24 = n > 1 ? e[n - 1][1] - e[n - 2][1] : 0, tot = D.t - D.s;
  const open = D.p.filter(c => c[1] > 0).length;
  const days = {"7": 7, "30": 30, "90": 90, "all": 99999}[range], last = Date.parse(e[n - 1][0]);
  let pts = e.filter(p => last - Date.parse(p[0]) <= days * 864e5); if (pts.length < 2) pts = e.slice(-2);
  pts = pts.map(p => [p[0], p[1] - D.s]);
  const dm = daily(), [y, mo] = cm, first = (new Date(Date.UTC(y, mo, 1)).getUTCDay() + 6) % 7, dim = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  const today = new Date().toISOString().slice(0, 10); let mt = 0, cells = "";
  for (let i = 0; i < first; i++) cells += "<div></div>";
  for (let d = 1; d <= dim; d++) { const k = `${y}-${String(mo + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`, v = dm[k]; if (v) mt += v;
    cells += `<div class="${k === today ? "t" : ""}">${d}${v !== undefined ? `<small class="${cls(v)}">${short(v)}</small>` : ""}</div>`; }
  const mn = new Date(Date.UTC(y, mo, 1)).toLocaleDateString("ru-RU", {month: "long", year: "numeric", timeZone: "UTC"});

  <div class="card"><div class="lbl">Баланс</div><div class="kv"><span class="lbl">Старт</span><b>${money(D.s)}</b></div><div class="kv"><span class="lbl">Свободно</span><b>${money(D.c)}</b></div></div></div>
  <div class="row"><div class="card"><div class="lbl">Доход за 24ч</div><div class="num ${cls(d24)}">${money(d24, 1)}</div></div>
  <div class="card"><div class="lbl">Доход всего</div><div class="num ${cls(tot)}">${money(tot, 1)}</div></div></div>
  <div class="row"><div class="card"><div class="lbl">Закрыто сделок</div><div class="num">${D.ct}</div></div>
  <div class="card"><div class="lbl">Монет в позиции</div><div class="num">${open} из ${D.p.length}</div></div></div>
  <div class="card"><b>${D.on ? (D.md === "dip" ? "Бот ждёт просадки" : "Бот следит за трендом") : "Торговля выключена"}</b>
  <p class="muted">${!D.on ? "Новых сделок нет. Включить можно на вкладке «Торговля»." : D.md === "dip" ? `Покупает при падении на ${D.dp.buy}% за сутки, закрывает с прибылью +${D.dp.tp}%.` : "Покупает монеты, которые растут, и продаёт, когда рост заканчивается."} Правила меняются на вкладке «Торговля».</p></div>
  <div class="card"><h2>График прибыли</h2><div class="num ${cls(tot)}">${money(tot, 1)}</div>
  <div class="tabs">${[["7", "7D"], ["30", "30D"], ["90", "90D"], ["all", "Всё время"]].map(r => `<button data-r="${r[0]}" class="${range === r[0] ? "on" : ""}">${r[1]}</button>`).join("")}</div>${chart(pts)}</div>
  <div class="card"><h2>Торговый календарь</h2><div class="nav"><button data-m="-1">‹</button><span>${mn}</span><button data-m="1">›</button></div>
  <div class="lbl" style="text-align:center">За месяц: <b class="${cls(mt)}">${money(mt, 1)}</b></div>
  <div class="cal">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(x => `<div class="h">${x}</div>`).join("")}${cells}</div></div>`;
}

}

}

function port() {

    return `<div class="card"><div class="coin"><h3>${nm}</h3><span class="badge ${up ? "up" : "dn"}">${up ? "в росте" : "в спаде"}</span></div>
    <div class="kv"><span class="lbl">Цена</span><b>$${px(p)}</b></div><div class="kv"><span class="lbl">Средняя за 200 дней</span><b>$${px(sma)}</b></div>
    <div class="kv"><span class="lbl">К средней за 200 дней</span><b class="${cls(diff)}">${diff >= 0 ? "+" : ""}${diff.toFixed(1)}%</b></div>
    ${D.vr ? '<div class="kv"><span class="lbl">В позиции</span><b>' + (q > 0 ? q + " ≈ " + money(c[5]) + (c[6] > 1 ? " · x" + c[6] : "") : "нет") + "</b></div>" : ""}</div>`; }).join("");

const mk = o => ({on: !!o.on, lv: o.lv || 1, md: o.md || "trend", buy: (o.dp || {}).buy || 5, tp: (o.dp || {}).tp || 1, sl: (o.dp || {}).sl === 0 ? 0 : (o.dp || {}).sl || 10});

  <p class="muted">Только Bybit Spot, без плеча. Сумма одной сделки небольшая, общий потолок ${money(r.max || 100)}.</p>
  <div class="chips">${[["off", "Выкл"], ["dry", "Пробный"], ["live", "Реальный"]].map(x => `<button data-rm="${x[0]}" class="${rc.m === x[0] ? "on" : ""}">${x[1]}</button>`).join("")}</div>

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!D) return;
  app.innerHTML = (tab === "home" ? (live() ? homeLive() : D.vr ? home() : homeStart()) : tab === "port" ? port() : tab === "ctl" ? ctrl() : tab === "ex" ? exch() : me()) + '<p class="note">Это не финансовый совет. Результаты торговли не гарантируют прибыль.</p>';
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; window.scrollTo(0, 0); }
  else if (b.dataset.r) range = b.dataset.r;
  else if (b.dataset.m) { cm[1] += +b.dataset.m; if (cm[1] < 0) { cm[1] = 11; cm[0]--; } if (cm[1] > 11) { cm[1] = 0; cm[0]++; } }
  else if (b.dataset.on) ctl.on = !ctl.on;
  else if (b.dataset.lv) ctl.lv = +b.dataset.lv;
  else if (b.dataset.md) ctl.md = b.dataset.md;
  else if (b.dataset.buy) ctl.buy = +b.dataset.buy;
  else if (b.dataset.tp) ctl.tp = +b.dataset.tp;
  else if (b.dataset.sl !== undefined) ctl.sl = +b.dataset.sl;
  else if (b.dataset.rm) rc.m = b.dataset.rm;
  else if (b.dataset.rp) rc.per = +b.dataset.rp;
  else if (b.dataset.rsave) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "real", m: rc.m, per: rc.per}));
    else alert("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.rstop) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "realstop"}));
    return;
  }
  else if (b.dataset.cx) {
    const k = document.getElementById("ak").value.trim(), sc = document.getElementById("as").value.trim();
    if (!/^[A-Za-z0-9]{8,64}$/.test(k) || !/^[A-Za-z0-9]{16,128}$/.test(sc)) { alert("Проверьте ключи: они состоят из букв и цифр, без пробелов."); return; }
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "connect", k, s: sc}));
    else alert("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else if (b.dataset.dx) {
    if (T() && T().sendData) T().sendData(JSON.stringify({a: "disconnect"}));
    return;
  }
  else if (b.dataset.save) {
    if (T() && T().sendData) T().sendData(JSON.stringify({on: ctl.on, lev: ctl.lv, mode: ctl.md, buy: ctl.buy, tp: ctl.tp, sl: ctl.sl}));
    else alert("Откройте приложение из Telegram, кнопкой в чате с ботом.");
    return;
  }
  else return;
  render();
});
